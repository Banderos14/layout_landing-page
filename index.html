<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <!--Header-->
    <header class="header">
      <div class="container">
        <div class="header__top">
          <a href="#" class="header__logo">
            <img src="./src/images/MyBiKEwhite.svg"
              class="header__logo-img"
              alt="Logo name">
          </a>

          <div class="header__actions">
            <div class="header__phone-wrapper">
              <a href="tel:+12345..." class="header__phone">+1 234 5555-55-55</a>
              <button class="header__phone-btn" aria-label="Show phone">
                <img src="./src/images/Icon-Phone-call.svg" alt="phone">
              </button>
            </div>

            <button class="header__menu-btn" aria-label="Open menu">
              <img src="./src/images/Icon-Burger-menu.svg" alt="menu-burger">
            </button>
          </div>
        </div>

        <div class="header__content">
          <h1 class="header__title">Take the Streets</h1>
        </div>

        <nav class="header__nav nav">
          <div class="nav__header">
            <a href="#" class="header__logo">
              <img src="./src/images/MyBiKEblack.svg"
                class="header__logo-img"
                alt="Logo name">
            </a>
            <button class="nav__close" aria-label="Close menu">
              <img src="./src/images/Icon-Close.svg" alt="nav-close-button">
            </button>
          </div>
          <ul class="nav__list">
            <div class="list__top">
              <li class="nav__item"><a href="#" class="nav__link">HOME</a></li>
              <li class="nav__item"><a href="#" class="nav__link">ABOUT US</a></li>
              <li class="nav__item"><a href="#" class="nav__link">COMPARE BIKES</a></li>
              <li class="nav__item"><a href="#" class="nav__link">DETAILS</a></li>
              <li class="nav__item"><a href="#" class="nav__link">CONTACTS</a></li>
            </div>
            <div class="list__bottom">
              <li class="nav__item"><a href="#" class="nav__link__under">+1 234 5555-55-55</a></li>
              <li class="nav__item"><a href="#" class="nav__link__under is-active">Book a test ride</a></li>
            </div>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
